# PostgreSQL profile: SPRING_PROFILES_ACTIVE=postgres
#
# Flyway owns the schema (src/main/resources/db/migration) and Hibernate only
# validates the entities against it at startup. Everything not set here is
# inherited from application.properties.
#
# The URL and username have local defaults. The password is deliberately not
# set here: supply SPRING_DATASOURCE_PASSWORD in the environment (Spring binds
# it to spring.datasource.password). Without it, startup fails at the first
# Flyway connection: "The server requested SCRAM-based authentication, but no
# password was provided."
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/synopsi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:synopsi}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
