spring.application.name=synopsi
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Flyway owns the schema only on Postgres (see application-postgres.properties);
# the migrations are Postgres SQL and must not run against H2.
spring.flyway.enabled=false

# Personalization Service Configuration

# Scoring weights (must sum to 1.0)
synopsi.personalization.weights.topic-preference=0.40
synopsi.personalization.weights.reading-history=0.30
synopsi.personalization.weights.positive-feedback=0.20
synopsi.personalization.weights.recency=0.10

# Thresholds
synopsi.personalization.thresholds.min-completion-for-engaged=70
synopsi.personalization.thresholds.min-read-time-for-engaged=60
synopsi.personalization.thresholds.high-interest-threshold=3
synopsi.personalization.thresholds.min-relevance-score=0.3

# Time decay parameters
synopsi.personalization.time-decay.decay-days=30
synopsi.personalization.time-decay.decay-rate=0.95

# Cache settings
synopsi.personalization.cache.ttl-minutes=10
synopsi.personalization.cache.max-cache-size=1000

# Spring Cache Configuration (if using Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m
spring.cache.cache-names=personalizedFeed,feeds,sources,articles

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.study.synopsi.controller

# Sort endpoints alphabetically
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Don't show Spring actuator endpoints
springdoc.show-actuator=false

# JWT Configuration
synopsi.jwt.secret=your-secret-key-change-this-in-production-must-be-at-least-256-bits-long
synopsi.jwt.expiration=86400000
# 86400000 ms = 24 hours

# Worker service account
# When both username and password are set, the account is created on startup if
# it does not exist. The ingestion and summarization workers log in with these
# credentials (API_USERNAME / API_PASSWORD). Leave unset to require manual
# registration via POST /api/v1/auth/register. Email defaults to
# <username>@worker.synopsi.local.
#synopsi.worker.username=
#synopsi.worker.password=
#synopsi.worker.email=

# Devtools settings
spring.devtools.restart.enabled=true