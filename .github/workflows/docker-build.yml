name: Docker Build

on:
  push:
    branches:
      - main
    paths:
      - 'synopsi-worker/**'
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'synopsi-worker/**'
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile'

jobs:
  build-ingestion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ingestion image
        uses: docker/build-push-action@v6
        with:
          context: synopsi-worker
          file: synopsi-worker/Dockerfile.ingestion
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/synopsi-ingestion:latest
            ${{ secrets.DOCKER_USERNAME }}/synopsi-ingestion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-summarization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push summarization image
        uses: docker/build-push-action@v6
        with:
          context: synopsi-worker
          file: synopsi-worker/Dockerfile.summarization
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/synopsi-summarization:latest
            ${{ secrets.DOCKER_USERNAME }}/synopsi-summarization:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
