name: API CI

on:
  push:
    branches:
      - main
    paths:
      - 'synopsi-api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'synopsi-api/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Docker is available for Testcontainers
        run: docker info --format '{{.ServerVersion}}'

      - name: Run tests
        run: ./gradlew :synopsi-api:clean :synopsi-api:test

      - name: Confirm the PostgreSQL schema test ran
        # PostgresSchemaMigrationTest skips itself without Docker and Gradle
        # still exits 0, so a runner without a daemon would pass silently.
        run: |
          report=synopsi-api/build/test-results/test/TEST-com.study.synopsi.PostgresSchemaMigrationTest.xml
          test -f "$report" || { echo "missing $report"; exit 1; }
          grep -Eq '<testsuite[^>]* skipped="0"' "$report" || { echo "PostgresSchemaMigrationTest was skipped"; grep -oE '<testsuite[^>]*>' "$report"; exit 1; }
          grep -Eq '<testsuite[^>]* tests="[1-9]' "$report" || { echo "PostgresSchemaMigrationTest ran no tests"; exit 1; }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: synopsi-api/build/test-results/test/
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: synopsi-api/build/reports/tests/test/
          retention-days: 30

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew :synopsi-api:bootJar -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: synopsi-api-jar
          path: synopsi-api/build/libs/synopsi-api-*.jar
          retention-days: 30
