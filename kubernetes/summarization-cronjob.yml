apiVersion: batch/v1
kind: CronJob
metadata:
  name: synopsi-summarization
spec:
  schedule: "*/10 * * * *"  # Every 10 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: summarization
              image: synopsi-summarization:latest
              imagePullPolicy: Never
              command: ["python", "-m", "summarization.main"]
              workingDir: /app
              env:
                # API connectivity
                - name: API_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: synopsi-config
                      key: api-base-url
                - name: API_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: synopsi-secrets
                      key: api-username
                - name: API_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: synopsi-secrets
                      key: api-password
          restartPolicy: OnFailure