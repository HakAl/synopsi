apiVersion: batch/v1
kind: CronJob
metadata:
  name: synopsi-ingestion
spec:
  schedule: "*/30 * * * *"  # Every 30 minutes
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: ingestion
              image: synopsi-ingestion:latest
              imagePullPolicy: Never
              command: ["python", "-m", "ingestion.main"]
              workingDir: /app
              env:
                # API connectivity
                - name: API_BASE_URL
                  valueFrom:
                    configMapKeyRef:
                      name: synopsi-config
                      key: api-base-url
                - name: API_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: synopsi-secrets
                      key: api-username
                - name: API_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: synopsi-secrets
                      key: api-password
          restartPolicy: OnFailure